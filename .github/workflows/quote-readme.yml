name: Update Quote Readme

on:
  workflow_dispatch:
  schedule:
    # Runs at 2 UTC everyday (Beijing time 10:00)
    - cron: "0 2 * * *"

jobs:
  update-readme:
    name: Update Quote README
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: siddharth2016/quote-readme@main
        with:
          OPTION: quote
